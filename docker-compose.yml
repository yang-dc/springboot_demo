services: 
 mysql: 
  image: mysql:8.0
  container_name: demo-mysql
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABSE: user
  ports:
    - "3306:3306"
  volumes:
    - mysql-data:/var/lib/mysql
  healthcheck:
   test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
   interval: 5s
   timeout: 3s
   retries: 10
 redis:
  image: redis:7-alpine
  container_name: demo-redis
  command: redis-server --requirepass 123123 --maxmemory 256mb --maxmemory-policy allkeys-lru
  ports: ["6379:6379"]
  volumes: ["redis-data:/data"]
  healthcheck:
    test: ["CMD", "redis-cli", "-a", "123123", "ping"]
    interval: 5s
    retries: 20

volumes: 
  mysql-data:
    driver: local
  redis-data: 
    driver: local